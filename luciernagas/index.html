<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Para ti, Jaqueline ⭐</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Canvas de estrellas -->
    <canvas id="stars-canvas"></canvas>

    <!-- Pantalla de inicio -->
    <div id="intro-overlay" class="overlay active">
        <div class="intro-content">
            <div class="star-icon">🌙⭐</div>
            <h1>Mira el cielo esta noche</h1>
            <p>Las estrellas tienen algo que decirte, Corazón de melón</p>
            <button id="btn-start" class="btn-glow">
                <span>Mirar al cielo</span>
            </button>
        </div>
    </div>

    <!-- Mensaje central -->
    <div id="message-overlay" class="overlay">
        <div class="message-box">
            <p class="msg-para">Para ti,</p>
            <h2 class="msg-name">Jaqueline Lara</h2>
            <div class="msg-divider">✦ ✦ ✦</div>
            <p class="msg-body" id="msg-body"></p>
            <div class="msg-signature" id="msg-signature">
                <p>Con todo mi cariño,</p>
                <p class="msg-firma">— Eddie M. 💕</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
